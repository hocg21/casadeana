
<h2 mat-dialog-title>Eliminar platillo</h2>

<mat-divider></mat-divider>

<div mat-dialog-content>
  ¿Seguro que deseas eliminar el platillo <strong>{{data.nombre}}</strong> ?
  <p>{{data.descripcion}}</p>
</div>

<mat-divider></mat-divider>

<div mat-dialog-actions>
  {{data |json}}
  <button mat-stroked-button (click)="cerrarModal()" >Cancelar</button>
  <button mat-raised-button color="warn"  cdkFocusInitial (click)="eliminarPlatillo(data.id, data.img)" >Eliminar</button>
</div>
