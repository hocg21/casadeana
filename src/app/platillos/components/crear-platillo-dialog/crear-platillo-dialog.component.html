

<h5 mat-dialog-title>Nuevo Platillo</h5>

<mat-divider></mat-divider>

<div mat-dialog-content>

  <form class="grid" [formGroup]="platilloForm" (ngSubmit)="guardarPlatillo()">

    <img [src]=" currentPlatillo | platilloImagen " class="rounded mx-auto d-block" style="max-width: 100%;" />

    <mat-form-field class="col-12">
      <mat-label>Nombre platillo</mat-label>
      <input
        matInput
        required
        type="text"
        formControlName="nombre"
      />
    </mat-form-field>

    <mat-form-field class="col-12">
      <mat-label>Descripci&oacute;n</mat-label>
      <textarea
        matInput
        required
        formControlName="descripcion"></textarea>
    </mat-form-field>

    <mat-form-field class="col-12">
      <mat-label>Precio</mat-label>
      <input
        matInput
        required
        type="number"
        formControlName="precio"
      />
    </mat-form-field>


    <mat-checkbox
      formControlName="recomendado"
    >Recomendado por la nutria</mat-checkbox>

  </form>

</div>
<mat-divider></mat-divider>
<div mat-dialog-actions >
  <button mat-stroked-button (click)="cerrarModal()" >Cancelar</button>
  <button mat-raised-button color="primary"  cdkFocusInitial (click)="guardarPlatillo()" >Continuar</button>
</div>
